<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kimi3Flow — Settings</title>
    <style>
      :root {
        --bg: #050608;
        --panel: #0d1017;
        --panel-2: #12161f;
        --border: #1e2530;
        --text: #e7ecf3;
        --dim: #8b94a3;
        --accent: #22d3ee;
        --accent-2: #38bdf8;
        --danger: #f87171;
        --ok: #34d399;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.55;
      }
      .wrap { max-width: 560px; margin: 48px auto; padding: 0 20px; }
      header { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; }
      .logo {
        width: 44px; height: 44px; border-radius: 12px;
        display: grid; place-items: center; font-weight: 800; color: #04212a;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      h1 { margin: 0; font-size: 20px; }
      .sub { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
      .field { display: block; margin-bottom: 20px; }
      .field > span { display: block; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%; padding: 10px 12px; border-radius: 9px;
        background: var(--panel); border: 1px solid var(--border); color: var(--text);
        font-size: 14px; outline: none;
      }
      input:focus { border-color: var(--accent); }
      small { display: block; margin-top: 6px; color: var(--dim); }
      code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      .key-row { display: flex; gap: 8px; }
      .actions { display: flex; gap: 10px; margin-top: 8px; }
      button {
        padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer;
        border: 1px solid var(--border);
      }
      .primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #04212a; }
      .ghost { background: var(--panel); color: var(--text); }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { margin-top: 16px; padding: 10px 12px; border-radius: 9px; font-size: 13px; border: 1px solid var(--border); background: var(--panel); }
      .status.ok { border-color: var(--ok); color: var(--ok); }
      .status.error { border-color: var(--danger); color: var(--danger); }
      .status.busy { color: var(--dim); }
      footer { margin-top: 32px; color: var(--dim); font-size: 13px; }
      kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 5px; padding: 2px 7px; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./options.js"></script>
  </body>
</html>
